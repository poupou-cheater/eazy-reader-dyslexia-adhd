<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app_title">Lecteur Inclusif</title>

<link href="https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/font/opendyslexic.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    /* --- THEMES & VARIABLES --- */
    :root {
        --bg-color: #f4f7f6;
        --panel-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
        --accent: #4361ee;
        --accent-hover: #3a53d0;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --border-radius: 16px;
        --input-bg: #f8fafc;
        --input-text: #0f172a;
    }

    /* Thème sombre copié exactement sur ton "Exercice 2" */
    [data-theme="dark"] {
        --bg-color: #202020; 
        --panel-bg: #1e1e1e;
        --text-color: #e0e0e0;
        --border-color: #333333;
        --accent: #4cc9f0;
        --accent-hover: #3eb5d8;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        --input-bg: #2d2d2d;
        --input-text: #ffffff;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 2vw 5vw;
        margin: 0;
        transition: background-color 0.3s, color 0.3s;
        overflow-x: hidden;
    }

    /* --- PANNEAU DE CONTRÔLE --- */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .boutons-header { display: flex; gap: 10px; }

    #panneauControle {
        background-color: var(--panel-bg); border: 1px solid var(--border-color);
        border-radius: var(--border-radius); padding: 30px; margin-bottom: 30px;
        box-shadow: var(--shadow); transition: all 0.3s;
    }

    .section-titre {
        font-size: 1.1rem; font-weight: 700; color: var(--text-color);
        margin-top: 30px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
        border-bottom: 2px solid var(--border-color); padding-bottom: 10px;
    }
    .section-titre:first-child { margin-top: 0; }

    .grille-reglages { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

    .reglage-item { display: flex; flex-direction: column; background: var(--input-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
    .reglage-item label { font-weight: 600; font-size: 0.9rem; margin-bottom: 12px; opacity: 0.9; }
    .reglage-ligne { display: flex; align-items: center; gap: 15px; }

    input[type="range"] { flex-grow: 1; accent-color: var(--accent); }
    select, input[type="color"] { background-color: var(--panel-bg); color: var(--input-text); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box; font-family: inherit; outline: none; }
    input[type="color"] { height: 40px; cursor: pointer; }

    .valeur-bulle { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; min-width: 50px; text-align: center; }

    textarea { width: 100%; min-height: 140px; background-color: var(--input-bg); color: var(--input-text); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; font-size: 1rem; box-sizing: border-box; resize: vertical; font-family: inherit; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: var(--accent); }

    .barre-boutons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn { background-color: var(--accent); color: #fff; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn:hover { background-color: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
    .btn-outline { background-color: transparent; border: 2px solid var(--border-color); color: var(--text-color); box-shadow: none; }
    .btn-outline:hover { background-color: var(--border-color); }
    .btn-green { background-color: #10b981; }
    .btn-green:hover { background-color: #059669; }
    .btn-purple { background-color: #8b5cf6; }
    .btn-purple:hover { background-color: #7c3aed; }

    /* --- ZONE DE LECTURE (Design Exercice 2) --- */
    #zoneLecture {
        margin-top: 20px; padding: 30px; border-radius: var(--border-radius);
        background-color: transparent; min-height: 300px;
        --bg-c1: #262626;
        --bg-c2: #1b1b1b;
    }

    #zoneLecture ::selection { background-color: #444444; color: inherit; }
    #zoneLecture ::-moz-selection { background-color: #444444; color: inherit; }

    /* Le paragraphe contient tout. S'il y a un numéro, il est "décalé" à gauche. */
    .bloc-paragraphe {
        margin-bottom: 40px; 
        position: relative;
    }
    
    /* On laisse la marge gauche QUE s'il y a un numéro */
    .bloc-paragraphe.avec-puce {
        padding-left: 60px; 
    }

    /* Le numéro (1., a.) est expulsé dans la marge gauche */
    .puce {
        position: absolute;
        left: 0;
        top: 12px; /* S'aligne parfaitement avec le premier bloc */
        width: 50px;
        text-align: right;
        font-weight: 900;
        font-size: 1.1em;
        opacity: 0.9;
    }

    /* Les phrases deviennent les fameux blocs gris */
    .mini-parti {
        display: block;            
        margin: 8px 0;             
        padding: 12px 18px;        
        border-radius: 6px;
        font-weight: bold;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    
    /* Alternance parfaite */
    .mini-parti:nth-child(odd) { background-color: var(--bg-c1); }
    .mini-parti:nth-child(even) { background-color: var(--bg-c2); }

    #zoneLecture.hover-actif .mini-parti:hover { 
        transform: scale(1.01); 
        box-shadow: inset 4px 0 0 var(--accent); 
    }

    /* --- FENÊTRE DE LECTURE (MASQUE SOMBRE) --- */
    #masqueLecture {
        position: fixed; left: 0; top: 50%; width: 100vw; height: 120px; 
        transform: translateY(-50%); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.85); 
        border-top: 4px solid var(--accent); border-bottom: 4px solid var(--accent); 
        pointer-events: none; display: none; z-index: 9999;
    }

    @media print {
        #panneauControle, .header-bar, #btnFlottant, #masqueLecture { display: none !important; }
        body, #zoneLecture { background-color: white !important; color: black !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
        .mini-parti { page-break-inside: avoid; border-bottom: 1px solid #ddd; margin-bottom: 5px; background-color: transparent !important; }
        .bloc-paragraphe { break-inside: avoid; }
    }
</style>
</head>
<body>

<div id="masqueLecture"></div>

<div class="header-bar">
    <h1 style="margin:0; font-size: 1.5rem;" data-i18n="app_title">Lecteur Inclusif</h1>
    <div class="boutons-header">
        <button class="btn btn-outline" onclick="toggleLang()" id="btnLang">🇫🇷 / 🇬🇧</button>
        <button class="btn btn-outline" onclick="toggleTheme()" id="btnTheme" data-i18n="theme_toggle">🌓 Thème</button>
    </div>
</div>

<div id="panneauControle">
    <div class="section-titre"><span data-i18n="section_text">📝 1. Texte à adapter</span></div>
    <textarea id="texteEntree" data-i18n-placeholder="placeholder_text" placeholder="Colle ton texte ici..." oninput="sauvegarderEtGenerer()"></textarea>
    
    <div class="barre-boutons">
        <button class="btn btn-outline" onclick="togglePanneau()"><span data-i18n="btn_fullscreen">👁️ Plein Écran</span></button>
        <button class="btn btn-outline" onclick="window.print()"><span data-i18n="btn_print">🖨️ PDF / Impression</span></button>
        <button class="btn btn-green" onclick="sauvegarderHTML()"><span data-i18n="btn_save_html">💾 Exporter HTML</span></button>
        <button class="btn btn-purple" onclick="sauvegarderJPEG()"><span data-i18n="btn_save_jpeg">🖼️ Exporter Image</span></button>
    </div>

    <div class="section-titre"><span data-i18n="section_colors">👁️ 2. Couleurs et Contrastes</span></div>
    <div class="grille-reglages">
        <div class="reglage-item">
            <label data-i18n="label_profile">Profil de couleurs :</label>
            <select id="profilCouleur" onchange="sauvegarderEtGenerer()">
                <option value="standard" data-i18n="profile_multi">🌈 Multicolore (Standard)</option>
                <option value="protanopie" data-i18n="profile_protanopia">🔵🟡 Protanopie / Deutéranopie</option>
                <option value="tritanopie" data-i18n="profile_tritanopia">🔴🟢 Tritanopie</option>
                <option value="monochrome" data-i18n="profile_mono">⚪⚫ Monochrome</option>
                <option value="personnalise" data-i18n="profile_custom">🎨 Personnalisé (Unique)</option>
            </select>
        </div>
        
        <div class="reglage-item">
            <label data-i18n="label_bg_colors">Couleurs de fond (Alternance) :</label>
            <div class="reglage-ligne">
                <input type="color" id="couleurFond1" value="#262626" onchange="sauvegarderEtAppliquer()">
                <input type="color" id="couleurFond2" value="#1b1b1b" onchange="sauvegarderEtAppliquer()">
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_text_color">Couleur du texte (Si personnalisé) :</label>
            <input type="color" id="couleurTextePerso" value="#e0e0e0" onchange="sauvegarderEtGenerer()">
        </div>
    </div>

    <div class="section-titre"><span data-i18n="section_typo">🔤 3. Police et Typographie</span></div>
    <div class="grille-reglages">
        <div class="reglage-item">
            <label data-i18n="label_font">Police d'écriture :</label>
            <select id="choixPolice" onchange="sauvegarderEtAppliquer()">
                <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif' data-i18n="font_system">Police du système (Comme Exercice 2)</option>
                <option value="'OpenDyslexic', sans-serif" data-i18n="font_opendyslexic">OpenDyslexic (Aide à la lecture)</option>
                <option value="Verdana, sans-serif" data-i18n="font_verdana">Verdana (Large et claire)</option>
                <option value="Tahoma, sans-serif" data-i18n="font_tahoma">Tahoma (Lettres distinctes)</option>
                <option value="'Trebuchet MS', sans-serif" data-i18n="font_trebuchet">Trebuchet MS</option>
                <option value="'Comic Sans MS', cursive, sans-serif" data-i18n="font_comic">Comic Sans MS</option>
            </select>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_size">Taille des lettres :</label>
            <div class="reglage-ligne">
                <input type="range" id="tailleLettre" min="14" max="80" value="18" oninput="mettreAJourValeur(this, 'px'); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-tailleLettre">18px</span>
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_letter_spacing">Espace entre les lettres :</label>
            <div class="reglage-ligne">
                <input type="range" id="distanceLettre" min="0" max="2" step="0.01" value="0.32" oninput="mettreAJourValeur(this, 'em'); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-distanceLettre">0.32em</span>
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_word_spacing">Espace entre les mots :</label>
            <div class="reglage-ligne">
                <input type="range" id="distanceEspace" min="0.1" max="3" step="0.05" value="0.25" oninput="mettreAJourValeur(this, 'em'); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-distanceEspace">0.25em</span>
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_line_height">Espace entre les lignes :</label>
            <div class="reglage-ligne">
                <input type="range" id="hauteurLigne" min="1.5" max="5" step="0.1" value="2.2" oninput="mettreAJourValeur(this, ''); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-hauteurLigne">2.2</span>
            </div>
        </div>
    </div>

    <div class="section-titre"><span data-i18n="section_focus">🧠 4. Aide à la Concentration</span></div>
    <div class="grille-reglages">
        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_bold">Texte tout en gras</label>
            <input type="checkbox" id="caseGras" checked style="width:20px;height:20px;" onchange="sauvegarderEtAppliquer()">
        </div>

        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_bionic">Fixation visuelle (Début des mots)</label>
            <input type="checkbox" id="caseBionic" style="width:20px;height:20px;" onchange="sauvegarderEtGenerer()">
        </div>
        
        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_ruler">Fenêtre de lecture (Cache la vue)</label>
            <input type="checkbox" id="caseRegle" style="width:20px;height:20px;" onchange="toggleRegle(this.checked); saveSettings();">
        </div>

        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_hover">Effet de survol des blocs</label>
            <input type="checkbox" id="caseHover" checked style="width:20px;height:20px;" onchange="toggleHover(this.checked); saveSettings();">
        </div>

        <div class="reglage-item">
            <label data-i18n="label_max_words">Taille max (Coupe les longues phrases) :</label>
            <div class="reglage-ligne">
                <input type="range" id="maxMotsParti" min="5" max="150" value="40" oninput="mettreAJourValeur(this, ''); sauvegarderEtGenerer();">
                <span class="valeur-bulle" id="val-maxMotsParti">40</span>
            </div>
        </div>
    </div>
</div>

<button id="btnFlottant" class="btn" style="position: fixed; top: 15px; right: 15px; display: none; z-index: 10000;" onclick="togglePanneau()">⚙️</button>

<div id="zoneLecture" class="hover-actif"></div>

<script>
// --- INTERNATIONALISATION (Traductions) ---
const translations = {
    fr: {
        app_title: "Lecteur Inclusif", section_text: "📝 1. Texte à adapter",
        placeholder_text: "Colle ton texte ou tes exercices ici...",
        btn_fullscreen: "👁️ Plein Écran", btn_print: "🖨️ PDF / Impression", btn_save_html: "💾 HTML", btn_save_jpeg: "🖼️ Image",
        section_colors: "👁️ 2. Couleurs et Contrastes", label_profile: "Profil de couleurs :",
        profile_multi: "🌈 Multicolore (Comme Exercice 2)", profile_protanopia: "🔵🟡 Protanopie", profile_tritanopia: "🔴🟢 Tritanopie", profile_mono: "⚪⚫ Monochrome", profile_custom: "🎨 Personnalisé",
        label_bg_colors: "Couleurs de fond (Alternance) :", label_text_color: "Couleur du texte :",
        section_typo: "🔤 3. Police et Typographie", label_font: "Police d'écriture :",
        font_system: "Système (Comme Exercice 2)", font_opendyslexic: "OpenDyslexic", font_verdana: "Verdana", font_tahoma: "Tahoma", font_trebuchet: "Trebuchet MS", font_comic: "Comic Sans MS",
        label_size: "Taille des lettres :", label_letter_spacing: "Espace (Lettres) :", label_word_spacing: "Espace (Mots) :", label_line_height: "Hauteur de ligne :",
        section_focus: "🧠 4. Aide à la Concentration", label_bold: "Texte tout en gras", label_bionic: "Fixation (Bionic)", label_ruler: "Fenêtre de lecture", label_hover: "Effet survol", label_max_words: "Taille max (Coupe phrases) :", theme_toggle: "🌓 Thème"
    },
    en: {
        app_title: "Inclusive Reader", section_text: "📝 1. Text to Adapt",
        placeholder_text: "Paste your text or exercises here...",
        btn_fullscreen: "👁️ Fullscreen", btn_print: "🖨️ Print / PDF", btn_save_html: "💾 HTML", btn_save_jpeg: "🖼️ Image",
        section_colors: "👁️ 2. Colors & Contrast", label_profile: "Color Profile:",
        profile_multi: "🌈 Multicolor", profile_protanopia: "🔵🟡 Protanopia", profile_tritanopia: "🔴🟢 Tritanopia", profile_mono: "⚪⚫ Monochrome", profile_custom: "🎨 Custom",
        label_bg_colors: "Background Colors (Alternating):", label_text_color: "Text Color:",
        section_typo: "🔤 3. Font and Typography", label_font: "Font Family:",
        font_system: "System Default", font_opendyslexic: "OpenDyslexic", font_verdana: "Verdana", font_tahoma: "Tahoma", font_trebuchet: "Trebuchet MS", font_comic: "Comic Sans MS",
        label_size: "Font Size:", label_letter_spacing: "Letter Spacing:", label_word_spacing: "Word Spacing:", label_line_height: "Line Height:",
        section_focus: "🧠 4. Focus Aid", label_bold: "All Bold", label_bionic: "Bionic Reading", label_ruler: "Reading Window", label_hover: "Hover Effect", label_max_words: "Max size (Splits sentences):", theme_toggle: "🌓 Theme"
    }
};

const userLang = navigator.language || navigator.userLanguage;
let currentLang = localStorage.getItem('readerSettings_lang') || (userLang.toLowerCase().startsWith('fr') ? 'fr' : 'en');

function toggleLang() {
    currentLang = currentLang === 'fr' ? 'en' : 'fr';
    localStorage.setItem('readerSettings_lang', currentLang);
    applyTranslations();
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (translations[currentLang][key]) el.setAttribute('placeholder', translations[currentLang][key]);
    });
    
    // Texte par défaut : l'Exercice 2 !
    const textarea = document.getElementById('texteEntree');
    if (!textarea.value.trim()) {
        textarea.value = `1. These documents are very interesting because they are directly linked to our sequence called Street art, offence or revitalizing tool. They illustrate the two different opinions that people have about street art in big cities like New York.

2. The first document is a famous graffiti made by the British artist Banksy in 2013 in Manhattan, New York. On the image, we can see a grey and old wall of a building. In the middle, there are two children drawn in black and white. The first child at the bottom is bending down and the second child is standing on his back to stay in balance. He is stretching his arm to reach a white sign on the wall. This sign has a red circle with a line, and inside there is a spray paint can. Under the symbol, it is written Graffiti is a crime. The child looks like he wants to catch the spray can.

3. The interpretation of the first document shows that street art can be seen as an offence or a provocation. Banksy uses irony because the sign says graffiti is a crime, but he creates art right next to it. It shows that artists like to play with rules and rebel against authority.

4. In conclusion, we can say that street art has two faces because it can be an offence against the law and the rules, but it is also a beautiful tool to revitalize the streets and bring color to our lives.`;
    }
}

// --- LOGIQUE DES COULEURS ET THEME ---
const palettes = {
    light: {
        standard: ['#1e40af', '#166534', '#b45309', '#b91c1c', '#6b21a8'],
        protanopie: ['#0033cc', '#b38f00', '#0055ff', '#cca300'],
        tritanopie: ['#cc0000', '#008080', '#990000', '#00cccc'],
        monochrome: ['#333333', '#111111', '#000000']
    },
    dark: {
        standard: ['#6ea2f5', '#7ee07e', '#f3b360', '#f88787', '#d9a5ff'], // Mêmes couleurs que Exercice 2.html
        protanopie: ['#3377ff', '#ffcc00', '#66b3ff', '#ffd633'], 
        tritanopie: ['#ff4d4d', '#00e6e6', '#ff1a1a', '#33ffff'], 
        monochrome: ['#cccccc', '#eeeeee', '#ffffff']
    }
};

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    
    if (newTheme === 'dark') {
        document.getElementById('couleurFond1').value = '#262626';
        document.getElementById('couleurFond2').value = '#1b1b1b';
        document.getElementById('couleurTextePerso').value = '#e0e0e0';
    } else {
        document.getElementById('couleurFond1').value = '#f8fafc';
        document.getElementById('couleurFond2').value = '#e2e8f0';
        document.getElementById('couleurTextePerso').value = '#0f172a';
    }
    
    sauvegarderEtGenerer();
}

const settingsList = ['profilCouleur', 'couleurFond1', 'couleurFond2', 'couleurTextePerso', 'choixPolice', 'tailleLettre', 'distanceLettre', 'distanceEspace', 'hauteurLigne', 'maxMotsParti'];
const checkboxList = ['caseGras', 'caseBionic', 'caseRegle', 'caseHover'];

function saveSettings() {
    settingsList.forEach(id => { localStorage.setItem('readerSettings_' + id, document.getElementById(id).value); });
    checkboxList.forEach(id => { localStorage.setItem('readerSettings_' + id, document.getElementById(id).checked); });
    localStorage.setItem('readerSettings_theme', document.documentElement.getAttribute('data-theme'));
}

function loadSettings() {
    const savedTheme = localStorage.getItem('readerSettings_theme');
    if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); } 

    settingsList.forEach(id => { const val = localStorage.getItem('readerSettings_' + id); if (val !== null) document.getElementById(id).value = val; });
    checkboxList.forEach(id => { const val = localStorage.getItem('readerSettings_' + id); if (val !== null) document.getElementById(id).checked = (val === 'true'); });

    ['tailleLettre', 'distanceLettre', 'distanceEspace', 'hauteurLigne', 'maxMotsParti'].forEach(id => {
        let suffixe = '';
        if(id === 'tailleLettre') suffixe = 'px';
        if(id === 'distanceLettre' || id === 'distanceEspace') suffixe = 'em';
        mettreAJourValeur(document.getElementById(id), suffixe);
    });
    
    toggleRegle(document.getElementById('caseRegle').checked);
    toggleHover(document.getElementById('caseHover').checked);
}

function appliquerReglages() {
    const zone = document.getElementById('zoneLecture');
    zone.style.fontFamily = document.getElementById('choixPolice').value;
    zone.style.fontSize = document.getElementById('tailleLettre').value + 'px';
    zone.style.letterSpacing = document.getElementById('distanceLettre').value + 'em';
    zone.style.wordSpacing = document.getElementById('distanceEspace').value + 'em';
    zone.style.lineHeight = document.getElementById('hauteurLigne').value;
    zone.style.fontWeight = document.getElementById('caseGras').checked ? 'bold' : 'normal';
    
    zone.style.setProperty('--bg-c1', document.getElementById('couleurFond1').value);
    zone.style.setProperty('--bg-c2', document.getElementById('couleurFond2').value);
}

function formaterMots(motsArray, bionicActif) {
    return motsArray.map(mot => {
        if (!bionicActif || mot.length <= 1) return mot;
        let limiteGras = Math.ceil(mot.length * 0.45);
        if(mot.startsWith('<')) return mot; 
        return `<strong style="font-weight: 900;">${mot.slice(0, limiteGras)}</strong>${mot.slice(limiteGras)}`;
    }).join(' ');
}

// LOGIQUE D'AFFICHAGE "EXERCICE 2"
function transformerTexte(texte, maxMots, bionicActif, profilCouleur) {
    // On sépare par retours à la ligne vides pour faire un paragraphe = une couleur
    const paragraphes = texte.split(/\n+/); 
    let htmlResultat = '';
    
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    let paletteActuelle = palettes[currentTheme][profilCouleur] || ['#333'];
    let couleurPerso = document.getElementById('couleurTextePerso').value;
    let couleurIndex = 0;

    paragraphes.forEach(para => {
        if (para.trim() === '') return;

        // Une couleur par paragraphe entier
        let couleurTexte = (profilCouleur === 'personnalise') ? couleurPerso : paletteActuelle[couleurIndex];

        // On cherche un numéro (1., a., etc.) au tout début du paragraphe
        const regexListe = /^((?:(?:exercice|question|partie)\s*\d*(?:\s*[:\-\.])?\s*|[a-z0-9]{1,3}[\.\)]|\-|\*)\s+)/i;
        const match = para.trim().match(regexListe);
        
        // Création du conteneur du paragraphe
        htmlResultat += `<div class="bloc-paragraphe ${match ? 'avec-puce' : ''}" style="color: ${couleurTexte};">`;
        
        let resteTexte = para.trim();
        
        // Si c'est une liste, on extrait la puce pour la caler à gauche en CSS
        if (match) {
            const puce = match[1];
            htmlResultat += `<div class="puce">${puce.trim()}</div>`;
            resteTexte = para.trim().substring(puce.length);
        }
        
        htmlResultat += `<div class="contenu-paragraphe">`;
        
        // On découpe le reste du texte par phrases (ou si c'est hyper long via maxMots)
        const mots = resteTexte.trim().split(/\s+/);
        if (mots.length > 0 && mots[0] !== '') {
            let morceauActuel = [];
            for (let i = 0; i < mots.length; i++) {
                morceauActuel.push(mots[i]);
                const estFinPhrase = /[.!?]$/.test(mots[i]);
                
                // Si on a atteint la fin d'une phrase, on crée un bloc gris
                if (estFinPhrase || morceauActuel.length >= maxMots || i === mots.length - 1) {
                    let texteMorceau = formaterMots(morceauActuel, bionicActif);
                    htmlResultat += `<span class="mini-parti" style="color: inherit;">${texteMorceau}</span>`;
                    morceauActuel = [];
                }
            }
        }
        
        htmlResultat += `</div></div>`; // Fin du paragraphe
        
        // On passe à la couleur suivante pour le prochain grand paragraphe
        if (profilCouleur !== 'personnalise') {
            couleurIndex = (couleurIndex + 1) % paletteActuelle.length;
        }
    });
    
    return htmlResultat;
}

function genererFiche() {
    const entree = document.getElementById('texteEntree').value;
    const zone = document.getElementById('zoneLecture');
    const maxMots = parseInt(document.getElementById('maxMotsParti').value);
    const bionicActif = document.getElementById('caseBionic').checked;
    const profilCouleur = document.getElementById('profilCouleur').value;
    
    if (entree.trim() === '') {
        zone.innerHTML = ''; return;
    }
    
    zone.innerHTML = transformerTexte(entree, maxMots, bionicActif, profilCouleur);
    appliquerReglages();
}

function togglePanneau() {
    const panneau = document.getElementById('panneauControle');
    const btnFlottant = document.getElementById('btnFlottant');
    if (panneau.style.display === 'none') {
        panneau.style.display = 'block'; btnFlottant.style.display = 'none';
    } else {
        panneau.style.display = 'none'; btnFlottant.style.display = 'block';
    }
}

// --- MASQUE ET HOVER ---
function toggleRegle(activer) {
    const masque = document.getElementById('masqueLecture');
    if (activer) {
        masque.style.display = 'block'; document.addEventListener('mousemove', bougerRegle);
    } else {
        masque.style.display = 'none'; document.removeEventListener('mousemove', bougerRegle);
    }
}

function bougerRegle(e) {
    const masque = document.getElementById('masqueLecture');
    masque.style.top = e.clientY + 'px';
}

function toggleHover(activer) {
    const zone = document.getElementById('zoneLecture');
    if (activer) { zone.classList.add('hover-actif'); } 
    else { zone.classList.remove('hover-actif'); }
}
