<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="app_title">Lecteur Inclusif</title>

<!-- Polices et Librairies externes -->
<link href="https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/font/opendyslexic.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
    /* --- THEMES & VARIABLES --- */
    :root {
        --bg-color: #f4f7f6;
        --panel-bg: #ffffff;
        --text-color: #1e293b;
        --border-color: #cbd5e1;
        --accent: #4361ee;
        --accent-hover: #3a53d0;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --border-radius: 16px;
        --input-bg: #f8fafc;
        --input-text: #0f172a;
    }

    [data-theme="dark"] {
        --bg-color: #121212;
        --panel-bg: #1e1e1e;
        --text-color: #f0f0f0;
        --border-color: #333333;
        --accent: #4cc9f0;
        --accent-hover: #3eb5d8;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        --input-bg: #2d2d2d;
        --input-text: #ffffff;
    }

    /* --- STYLE GLOBAL & UI --- */
    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 2vw 5vw;
        margin: 0;
        transition: background-color 0.3s, color 0.3s;
        overflow-x: hidden;
    }

    /* En-tête et Panneau de contrôle */
    .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .boutons-header {
        display: flex;
        gap: 10px;
    }

    #panneauControle {
        background-color: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: var(--border-radius);
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: var(--shadow);
        transition: all 0.3s;
    }

    .section-titre {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--text-color);
        margin-top: 30px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 10px;
    }
    .section-titre:first-child { margin-top: 0; }

    /* Grille de réglages */
    .grille-reglages {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 20px;
    }

    .reglage-item {
        display: flex;
        flex-direction: column;
        background: var(--input-bg);
        padding: 15px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
    }

    .reglage-item label {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 12px;
        opacity: 0.9;
    }

    .reglage-ligne {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    input[type="range"] { 
        flex-grow: 1; 
        accent-color: var(--accent);
    }
    
    select, input[type="color"] {
        background-color: var(--panel-bg);
        color: var(--input-text);
        border: 1px solid var(--border-color);
        padding: 10px;
        border-radius: 8px;
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        outline: none;
    }
    
    input[type="color"] { height: 40px; cursor: pointer; }

    .valeur-bulle {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        min-width: 50px;
        text-align: center;
    }

    textarea {
        width: 100%;
        min-height: 140px;
        background-color: var(--input-bg);
        color: var(--input-text);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 15px;
        font-size: 1rem;
        box-sizing: border-box;
        resize: vertical;
        font-family: inherit;
        outline: none;
        transition: border-color 0.2s;
    }
    
    textarea:focus {
        border-color: var(--accent);
    }

    /* Boutons */
    .barre-boutons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 20px;
    }

    .btn {
        background-color: var(--accent);
        color: #fff;
        border: none;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn:hover { background-color: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }
    .btn-outline { background-color: transparent; border: 2px solid var(--border-color); color: var(--text-color); box-shadow: none; }
    .btn-outline:hover { background-color: var(--border-color); }
    .btn-green { background-color: #10b981; }
    .btn-green:hover { background-color: #059669; }
    .btn-purple { background-color: #8b5cf6; }
    .btn-purple:hover { background-color: #7c3aed; }

    /* --- ZONE DE LECTURE --- */
    #zoneLecture {
        margin-top: 20px;
        padding: 30px;
        border-radius: var(--border-radius);
        background-color: var(--panel-bg);
        min-height: 300px;
        box-shadow: var(--shadow);
        border: 1px solid var(--border-color);
    }

    .mini-parti {
        display: block;
        margin: 12px 0;
        padding: 18px 24px;
        border-radius: 10px;
        transition: transform 0.1s ease-in-out;
    }
    .mini-parti:hover { transform: scale(1.01); box-shadow: inset 4px 0 0 var(--accent); }

    #regleLecture {
        position: absolute;
        left: 0;
        width: 100%;
        height: 12px;
        background-color: rgba(67, 97, 238, 0.3);
        pointer-events: none;
        display: none;
        z-index: 9999;
        backdrop-filter: invert(10%);
    }

    /* Impression propre */
    @media print {
        #panneauControle, .header-bar, #btnFlottant, #regleLecture { display: none !important; }
        body, #zoneLecture { background-color: white !important; color: black !important; padding: 0 !important; box-shadow: none !important; border: none !important; }
        .mini-parti { page-break-inside: avoid; border-bottom: 1px solid #ddd; margin-bottom: 5px; }
    }
</style>
</head>
<body>

<div id="regleLecture"></div>

<div class="header-bar">
    <h1 style="margin:0; font-size: 1.5rem;" data-i18n="app_title">Lecteur Inclusif</h1>
    <div class="boutons-header">
        <button class="btn btn-outline" onclick="toggleLang()" id="btnLang">🇫🇷 / 🇬🇧</button>
        <button class="btn btn-outline" onclick="toggleTheme()" id="btnTheme" data-i18n="theme_toggle">🌓 Thème</button>
    </div>
</div>

<div id="panneauControle">
    <div class="section-titre"><span data-i18n="section_text">📝 1. Texte à adapter</span></div>
    <!-- Mise à jour automatique (oninput) activée ici -->
    <textarea id="texteEntree" data-i18n-placeholder="placeholder_text" placeholder="Colle ton texte ici..." oninput="sauvegarderEtGenerer()"></textarea>
    
    <div class="barre-boutons">
        <button class="btn btn-outline" onclick="togglePanneau()"><span data-i18n="btn_fullscreen">👁️ Plein Écran</span></button>
        <button class="btn btn-outline" onclick="window.print()"><span data-i18n="btn_print">🖨️ PDF / Impression</span></button>
        <button class="btn btn-green" onclick="sauvegarderHTML()"><span data-i18n="btn_save_html">💾 Exporter HTML</span></button>
        <button class="btn btn-purple" onclick="sauvegarderJPEG()"><span data-i18n="btn_save_jpeg">🖼️ Exporter Image</span></button>
    </div>

    <div class="section-titre"><span data-i18n="section_colors">👁️ 2. Couleurs et Contrastes</span></div>
    <div class="grille-reglages">
        <div class="reglage-item">
            <label data-i18n="label_profile">Profil de couleurs :</label>
            <select id="profilCouleur" onchange="sauvegarderEtGenerer()">
                <option value="standard" data-i18n="profile_multi">🌈 Multicolore (Standard)</option>
                <option value="protanopie" data-i18n="profile_protanopia">🔵🟡 Protanopie / Deutéranopie</option>
                <option value="tritanopie" data-i18n="profile_tritanopia">🔴🟢 Tritanopie</option>
                <option value="monochrome" data-i18n="profile_mono">⚪⚫ Monochrome</option>
                <option value="personnalise" data-i18n="profile_custom">🎨 Personnalisé (Unique)</option>
            </select>
        </div>
        
        <div class="reglage-item">
            <label data-i18n="label_bg_colors">Couleurs de fond (Alternance) :</label>
            <div class="reglage-ligne">
                <input type="color" id="couleurFond1" value="#f8fafc" onchange="sauvegarderEtAppliquer()">
                <input type="color" id="couleurFond2" value="#e2e8f0" onchange="sauvegarderEtAppliquer()">
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_text_color">Couleur du texte (Si personnalisé) :</label>
            <input type="color" id="couleurTextePerso" value="#0f172a" onchange="sauvegarderEtGenerer()">
        </div>
    </div>

    <div class="section-titre"><span data-i18n="section_typo">🔤 3. Police et Typographie</span></div>
    <div class="grille-reglages">
        <div class="reglage-item">
            <label data-i18n="label_font">Police d'écriture :</label>
            <select id="choixPolice" onchange="sauvegarderEtAppliquer()">
                <option value="'OpenDyslexic', sans-serif" data-i18n="font_opendyslexic">OpenDyslexic (Aide à la lecture)</option>
                <option value="Verdana, sans-serif" data-i18n="font_verdana">Verdana (Large et claire)</option>
                <option value="Tahoma, sans-serif" data-i18n="font_tahoma">Tahoma (Lettres distinctes)</option>
                <option value="'Trebuchet MS', sans-serif" data-i18n="font_trebuchet">Trebuchet MS</option>
                <option value="'Comic Sans MS', cursive, sans-serif" data-i18n="font_comic">Comic Sans MS</option>
                <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' data-i18n="font_system">Système</option>
            </select>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_size">Taille des lettres :</label>
            <div class="reglage-ligne">
                <input type="range" id="tailleLettre" min="14" max="80" value="20" oninput="mettreAJourValeur(this, 'px'); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-tailleLettre">20px</span>
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_letter_spacing">Espace entre les lettres :</label>
            <div class="reglage-ligne">
                <input type="range" id="distanceLettre" min="0" max="2" step="0.05" value="0.1" oninput="mettreAJourValeur(this, 'em'); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-distanceLettre">0.1em</span>
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_word_spacing">Espace entre les mots :</label>
            <div class="reglage-ligne">
                <input type="range" id="distanceEspace" min="0.1" max="3" step="0.1" value="0.3" oninput="mettreAJourValeur(this, 'em'); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-distanceEspace">0.3em</span>
            </div>
        </div>

        <div class="reglage-item">
            <label data-i18n="label_line_height">Espace entre les lignes :</label>
            <div class="reglage-ligne">
                <input type="range" id="hauteurLigne" min="1.5" max="5" step="0.1" value="2.0" oninput="mettreAJourValeur(this, ''); sauvegarderEtAppliquer()">
                <span class="valeur-bulle" id="val-hauteurLigne">2.0</span>
            </div>
        </div>
    </div>

    <div class="section-titre"><span data-i18n="section_focus">🧠 4. Aide à la Concentration</span></div>
    <div class="grille-reglages">
        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_bold">Texte tout en gras</label>
            <input type="checkbox" id="caseGras" style="width:20px;height:20px;" onchange="sauvegarderEtAppliquer()">
        </div>

        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_bionic">Fixation visuelle (Début des mots)</label>
            <input type="checkbox" id="caseBionic" checked style="width:20px;height:20px;" onchange="sauvegarderEtGenerer()">
        </div>
        
        <div class="reglage-item" style="flex-direction: row; align-items: center; justify-content: space-between;">
            <label style="margin:0;" data-i18n="label_ruler">Guide de lecture interactif</label>
            <input type="checkbox" id="caseRegle" style="width:20px;height:20px;" onchange="toggleRegle(this.checked); saveSettings();">
        </div>

        <div class="reglage-item">
            <label data-i18n="label_max_words">Taille max des blocs (Mots/bloc) :</label>
            <div class="reglage-ligne">
                <input type="range" id="maxMotsParti" min="5" max="100" value="15" oninput="mettreAJourValeur(this, ''); sauvegarderEtGenerer();">
                <span class="valeur-bulle" id="val-maxMotsParti">15</span>
            </div>
        </div>
    </div>
</div>

<button id="btnFlottant" class="btn" style="position: fixed; top: 15px; right: 15px; display: none; z-index: 10000;" onclick="togglePanneau()">⚙️</button>

<div id="zoneLecture"></div>

<script>
// --- INTERNATIONALISATION (Traductions) ---
const translations = {
    fr: {
        app_title: "Lecteur Inclusif",
        section_text: "📝 1. Texte à adapter",
        placeholder_text: "Colle ton texte ici pour l'adapter...",
        btn_fullscreen: "👁️ Plein Écran",
        btn_print: "🖨️ PDF / Impression",
        btn_save_html: "💾 Exporter HTML",
        btn_save_jpeg: "🖼️ Exporter Image",
        section_colors: "👁️ 2. Couleurs et Contrastes",
        label_profile: "Profil de couleurs :",
        profile_multi: "🌈 Multicolore (Standard)",
        profile_protanopia: "🔵🟡 Protanopie / Deutéranopie",
        profile_tritanopia: "🔴🟢 Tritanopie",
        profile_mono: "⚪⚫ Monochrome",
        profile_custom: "🎨 Personnalisé (Unique)",
        label_bg_colors: "Couleurs de fond (Alternance) :",
        label_text_color: "Couleur du texte (Si personnalisé) :",
        section_typo: "🔤 3. Police et Typographie",
        label_font: "Police d'écriture :",
        font_opendyslexic: "OpenDyslexic (Aide à la lecture)",
        font_verdana: "Verdana (Large et claire)",
        font_tahoma: "Tahoma (Lettres distinctes)",
        font_trebuchet: "Trebuchet MS",
        font_comic: "Comic Sans MS",
        font_system: "Système",
        label_size: "Taille des lettres :",
        label_letter_spacing: "Espace entre les lettres :",
        label_word_spacing: "Espace entre les mots :",
        label_line_height: "Espace entre les lignes :",
        section_focus: "🧠 4. Aide à la Concentration",
        label_bold: "Texte tout en gras",
        label_bionic: "Fixation visuelle (Début des mots)",
        label_ruler: "Guide de lecture interactif",
        label_max_words: "Taille max des blocs (Mots/bloc) :",
        theme_toggle: "🌓 Thème"
    },
    en: {
        app_title: "Inclusive Reader",
        section_text: "📝 1. Text to Adapt",
        placeholder_text: "Paste your text here to adapt it...",
        btn_fullscreen: "👁️ Fullscreen",
        btn_print: "🖨️ Print / PDF",
        btn_save_html: "💾 Export HTML",
        btn_save_jpeg: "🖼️ Export Image",
        section_colors: "👁️ 2. Colors & Contrast",
        label_profile: "Color Profile:",
        profile_multi: "🌈 Multicolor (Standard)",
        profile_protanopia: "🔵🟡 Protanopia / Deuteranopia",
        profile_tritanopia: "🔴🟢 Tritanopia",
        profile_mono: "⚪⚫ Monochrome",
        profile_custom: "🎨 Custom (Single Color)",
        label_bg_colors: "Background Colors (Alternating):",
        label_text_color: "Text Color (If custom):",
        section_typo: "🔤 3. Font and Typography",
        label_font: "Font Family:",
        font_opendyslexic: "OpenDyslexic (Reading Aid)",
        font_verdana: "Verdana (Wide and clear)",
        font_tahoma: "Tahoma (Distinct letters)",
        font_trebuchet: "Trebuchet MS",
        font_comic: "Comic Sans MS",
        font_system: "System Default",
        label_size: "Font Size:",
        label_letter_spacing: "Letter Spacing:",
        label_word_spacing: "Word Spacing:",
        label_line_height: "Line Height:",
        section_focus: "🧠 4. Focus Aid",
        label_bold: "All Text in Bold",
        label_bionic: "Visual Fixation (Start of words)",
        label_ruler: "Interactive Reading Guide",
        label_max_words: "Max block size (Words/block):",
        theme_toggle: "🌓 Theme"
    }
};

// Détection de langue plus robuste
const userLang = navigator.language || navigator.userLanguage;
let currentLang = localStorage.getItem('readerSettings_lang') || (userLang.toLowerCase().startsWith('fr') ? 'fr' : 'en');

function toggleLang() {
    currentLang = currentLang === 'fr' ? 'en' : 'fr';
    localStorage.setItem('readerSettings_lang', currentLang);
    applyTranslations();
}

function applyTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[currentLang][key]) el.textContent = translations[currentLang][key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (translations[currentLang][key]) el.setAttribute('placeholder', translations[currentLang][key]);
    });
    
    const textarea = document.getElementById('texteEntree');
    if (!textarea.value.trim()) {
        textarea.value = currentLang === 'fr' 
            ? "Collez votre texte ici. Modifiez les réglages ci-dessus pour adapter l'affichage et réduire la fatigue visuelle."
            : "Paste your text here. Modify the settings above to adjust the display and reduce visual fatigue.";
    }
}

// --- LOGIQUE DES COULEURS ET THEME ---
// Différenciation des couleurs pour qu'elles soient lisibles peu importe le thème (clair ou sombre)
const palettes = {
    light: {
        standard: ['#1e40af', '#166534', '#b45309', '#b91c1c', '#6b21a8'], // Couleurs foncées pour fond blanc
        protanopie: ['#0033cc', '#b38f00', '#0055ff', '#cca300'],
        tritanopie: ['#cc0000', '#008080', '#990000', '#00cccc'],
        monochrome: ['#333333', '#111111', '#000000']
    },
    dark: {
        standard: ['#5a95f5', '#60b860', '#e09838', '#e86a6a', '#b77be6'], // Couleurs claires pour fond noir
        protanopie: ['#3377ff', '#ffcc00', '#66b3ff', '#ffd633'], 
        tritanopie: ['#ff4d4d', '#00e6e6', '#ff1a1a', '#33ffff'], 
        monochrome: ['#cccccc', '#eeeeee', '#ffffff']
    }
};

function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    
    // Remplacement automatique des couleurs de fond/texte pour éviter les problèmes de contraste
    if (newTheme === 'dark') {
        document.getElementById('couleurFond1').value = '#1e1e1e';
        document.getElementById('couleurFond2').value = '#121212';
        document.getElementById('couleurTextePerso').value = '#ffffff';
    } else {
        document.getElementById('couleurFond1').value = '#f8fafc';
        document.getElementById('couleurFond2').value = '#e2e8f0';
        document.getElementById('couleurTextePerso').value = '#0f172a';
    }
    
    sauvegarderEtGenerer();
}

// --- SAUVEGARDE DES REGLAGES (LocalStorage) ---
const settingsList = ['profilCouleur', 'couleurFond1', 'couleurFond2', 'couleurTextePerso', 'choixPolice', 'tailleLettre', 'distanceLettre', 'distanceEspace', 'hauteurLigne', 'maxMotsParti'];
const checkboxList = ['caseGras', 'caseBionic', 'caseRegle'];

function saveSettings() {
    settingsList.forEach(id => {
        localStorage.setItem('readerSettings_' + id, document.getElementById(id).value);
    });
    checkboxList.forEach(id => {
        localStorage.setItem('readerSettings_' + id, document.getElementById(id).checked);
    });
    localStorage.setItem('readerSettings_theme', document.documentElement.getAttribute('data-theme'));
}

function loadSettings() {
    // Thème (Automatique basé sur OS ou depuis sauvegarde)
    const savedTheme = localStorage.getItem('readerSettings_theme');
    if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
    } else {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
    }

    // Chargement des autres paramètres
    settingsList.forEach(id => {
        const val = localStorage.getItem('readerSettings_' + id);
        if (val !== null) document.getElementById(id).value = val;
    });
    checkboxList.forEach(id => {
        const val = localStorage.getItem('readerSettings_' + id);
        if (val !== null) document.getElementById(id).checked = (val === 'true');
    });

    ['tailleLettre', 'distanceLettre', 'distanceEspace', 'hauteurLigne', 'maxMotsParti'].forEach(id => {
        let suffixe = '';
        if(id === 'tailleLettre') suffixe = 'px';
        if(id === 'distanceLettre' || id === 'distanceEspace') suffixe = 'em';
        mettreAJourValeur(document.getElementById(id), suffixe);
    });
    
    toggleRegle(document.getElementById('caseRegle').checked);
}

// --- LOGIQUE PRINCIPALE ---
function mettreAJourValeur(element, suffixe) {
    document.getElementById('val-' + element.id).textContent = element.value + suffixe;
}

function sauvegarderEtAppliquer() {
    appliquerReglages();
    saveSettings();
}

function sauvegarderEtGenerer() {
    genererFiche();
    saveSettings();
}

function appliquerReglages() {
    const zone = document.getElementById('zoneLecture');
    zone.style.fontFamily = document.getElementById('choixPolice').value;
    zone.style.fontSize = document.getElementById('tailleLettre').value + 'px';
    zone.style.letterSpacing = document.getElementById('distanceLettre').value + 'em';
    zone.style.wordSpacing = document.getElementById('distanceEspace').value + 'em';
    zone.style.lineHeight = document.getElementById('hauteurLigne').value;
    zone.style.fontWeight = document.getElementById('caseGras').checked ? 'bold' : 'normal';
    
    const c1 = document.getElementById('couleurFond1').value;
    const c2 = document.getElementById('couleurFond2').value;
    
    document.querySelectorAll('.mini-parti:nth-child(odd)').forEach(el => el.style.backgroundColor = c1);
    document.querySelectorAll('.mini-parti:nth-child(even)').forEach(el => el.style.backgroundColor = c2);
}

function transformerTexte(texte, maxMots, bionicActif, profilCouleur) {
    const paragraphes = texte.split(/\n+/);
    let htmlResultat = '';
    
    // Récupération de la palette adaptée au thème actuel (light ou dark)
    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    let paletteActuelle = palettes[currentTheme][profilCouleur] || ['#333'];
    let couleurPerso = document.getElementById('couleurTextePerso').value;
    let couleurIndex = 0;

    paragraphes.forEach(para => {
        if (para.trim() === '') return;
        const mots = para.trim().split(/\s+/);
        let morceauActuel = [];
        
        for (let i = 0; i < mots.length; i++) {
            morceauActuel.push(mots[i]);
            const estFinPhrase = /[.!?]$/.test(mots[i]);
            
            if (morceauActuel.length >= maxMots || estFinPhrase || i === mots.length - 1) {
                let texteMorceau = morceauActuel.map(mot => {
                    if (!bionicActif || mot.length <= 1) return mot;
                    let limiteGras = Math.ceil(mot.length * 0.45);
                    if(mot.startsWith('<')) return mot; 
                    return `<strong style="font-weight: 900;">${mot.slice(0, limiteGras)}</strong>${mot.slice(limiteGras)}`;
                }).join(' ');
                
                let couleurTexte = (profilCouleur === 'personnalise') ? couleurPerso : paletteActuelle[couleurIndex];
                
                htmlResultat += `<span class="mini-parti" style="color: ${couleurTexte};">${texteMorceau}</span>`;
                
                if (profilCouleur !== 'personnalise') {
                    couleurIndex = (couleurIndex + 1) % paletteActuelle.length;
                }
                morceauActuel = [];
            }
        }
    });
    return htmlResultat;
}

function genererFiche() {
    const entree = document.getElementById('texteEntree').value;
    const zone = document.getElementById('zoneLecture');
    const maxMots = parseInt(document.getElementById('maxMotsParti').value);
    const bionicActif = document.getElementById('caseBionic').checked;
    const profilCouleur = document.getElementById('profilCouleur').value;
    
    if (entree.trim() === '') {
        zone.innerHTML = '';
        return;
    }
    
    zone.innerHTML = transformerTexte(entree, maxMots, bionicActif, profilCouleur);
    appliquerReglages();
}

function togglePanneau() {
    const panneau = document.getElementById('panneauControle');
    const btnFlottant = document.getElementById('btnFlottant');
    if (panneau.style.display === 'none') {
        panneau.style.display = 'block';
        btnFlottant.style.display = 'none';
    } else {
        panneau.style.display = 'none';
        btnFlottant.style.display = 'block';
    }
}

function toggleRegle(activer) {
    const regle = document.getElementById('regleLecture');
    if (activer) {
        regle.style.display = 'block';
        document.body.addEventListener('mousemove', bougerRegle);
    } else {
        regle.style.display = 'none';
        document.body.removeEventListener('mousemove', bougerRegle);
    }
}

function bougerRegle(e) {
    const regle = document.getElementById('regleLecture');
    regle.style.top = (e.pageY - 6) + 'px';
}

function sauvegarderHTML() {
    genererFiche();
    const zoneLecture = document.getElementById('zoneLecture');
    const contenuZone = zoneLecture.innerHTML;
    
    const bgBody = getComputedStyle(document.body).backgroundColor;
    const colorText = getComputedStyle(document.body).color;
    const bgPanel = getComputedStyle(zoneLecture).backgroundColor;

    const documentHTML = `<!DOCTYPE html>
<html lang="${currentLang}">
<head>
    <meta charset="UTF-8">
    <title>${translations[currentLang].app_title} - Export</title>
    <link href="https://cdn.jsdelivr.net/npm/opendyslexic@1.0.3/font/opendyslexic.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: ${bgBody}; 
            color: ${colorText}; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 40px; 
            margin: 0;
        }
        #zoneLecture { 
            background-color: ${bgPanel};

            padding: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            ${zoneLecture.style.cssText} 
        }
        .mini-parti { 
            display: block; margin: 12px 0; padding: 18px 24px; border-radius: 10px; 
        }
    </style>
</head>
<body>
    <div id="zoneLecture">
        ${contenuZone}
    </div>
</body>
</html>`;

    const blob = new Blob([documentHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const lien = document.createElement('a');
    lien.href = url;
    lien.download = 'texte_accessible.html';
    document.body.appendChild(lien);
    lien.click();
    document.body.removeChild(lien);
    URL.revokeObjectURL(url);
}

function sauvegarderJPEG() {
    const zoneLecture = document.getElementById('zoneLecture');
    const regle = document.getElementById('regleLecture');
    const etatRegle = regle.style.display;
    
    regle.style.display = 'none';
    
    html2canvas(zoneLecture, {
        backgroundColor: getComputedStyle(document.body).backgroundColor,
        scale: 2
    }).then(canvas => {
        regle.style.display = etatRegle;
        
        const link = document.createElement('a');
        link.download = 'texte_accessible.jpg';
        link.href = canvas.toDataURL('image/jpeg', 0.9);
        link.click();
    });
}
